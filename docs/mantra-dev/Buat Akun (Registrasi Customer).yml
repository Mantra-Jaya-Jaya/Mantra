info:
  name: Buat Akun (Registrasi Customer)
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}api/v1/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |
      {
        "username": "hamim_baru",
        "email": "hamim_baru@gmail.com",
        "password": "Customer#123",
        "konfirmasi_password": "Customer#123",
        "nama_lengkap": "Hamim Baru",
        "no_telp": "081234567890"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
